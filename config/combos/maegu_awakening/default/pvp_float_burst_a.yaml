name: 'PvP — Float Burst (A) — Fan Kick re-float'
description: |
  Float-burst variation prioritising air-attack damage. Fan Kick is the
  go-to re-float for air-attack procs. Foxflare Cleave (Q) can swap in
  for damage / evasion shred but has a longer windup so you'll be
  unprotected for longer.

  Inputs — Pre-awk SPACE (prebuff Charmed) → W+RMB → F → A/D+RMB catch
  → S+F → A/W+SHIFT dash → RMB (standup KB) → S+LMB first hit →
  SHIFT+LMB first hit → SHIFT+F (hold) → SHIFT+X → S+E.

  Courtesy of fafi.
difficulty: advanced
