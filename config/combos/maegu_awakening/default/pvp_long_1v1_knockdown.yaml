combo_id: pvp_long_1v1_knockdown
class: Maegu
spec: Awakening
bundle_id: default
category: pvp
name: 'PvP — Long 1v1 Combo #3 (Knockdown / Down-attack)'
description: |
  Knockdown combo example — least popular Awaegu option since it
  relies on downsmash procs to reset the CC timer. If Fan Kick or
  Emberclaw Crush downsmash lands, you reset the CC; if not, the
  target may stand up sooner than you'd prefer.

  Inputs — Pre-awk SPACE (Charmed catch) → W+RMB → S+LMB first hit →
  RMB → A/D+RMB → RMB → E → SHIFT+Q → Q → SHIFT+LMB first hit →
  SHIFT+F (hold) IF DOWNSMASH → S+F → RMB → A/D+RMB → F → SHIFT+X
  → S+E.

  Courtesy of fafi.
difficulty: advanced
combo_window_ms: 300
