combo_id: pve_dps_priority
class: Maegu
spec: Awakening
bundle_id: default
category: pve
mode: priority
name: 'PvE — DPS Priority'
description: |
  Cooldown-driven Awakening Maegu PvE rotation. Apply -DP at the start.

  Tier 0 (Spiritforge entry) — Hazy Path (movement) or fast-cast
  Emberclaw Slash. Backups: Emberclaw Finale / Crush / Torrent.

  Tier 1 (Top Priority) — Foxflare Cleave, Twirling Rhapsody,
  Foxflare Fleche, Emberclaw Slash → Flow: Emberclaw Sweep.
  Emberclaw Slash promotes to highest priority while -DP needs
  reapplying.

  Tier 2 (Core DPS) — Twirling Foxflare → Flow: Foxflare Encore,
  Emberclaw Finale, Foxflare Ambush, Foxflare Stroke (AP buff is
  only relevant below AP caps), Emberclaw Crush, Twirling Retreat
  (into Twirling Foxflare or Emberclaw Torrent), Emberclaw Torrent.

  Tier 3 (Filler) — Fan Kick, plus Foxflare Ambush / Foxflare
  Fleche / Twirling Rhapsody when nothing higher is up.

  Notable Cancels (encoded as prefers_after) — these chains skip
  the linger / windup of the preceding skill:
    Foxflare Ambush → Foxflare Fleche
    Foxflare Ambush → Twirling Rhapsody
    Twirling Retreat → Twirling Foxflare
    Twirling Retreat → Emberclaw Torrent

  Hard chains (encoded as requires_prev):
    Flow: Emberclaw Sweep — only cast right after Emberclaw Slash
    Flow: Foxflare Encore — only cast right after Twirling Foxflare
priority:
  - tier: Spiritforge Entry
    description: |
      Open every engagement Spiritforging — Hazy Path for movement,
      or fast-cast Emberclaw Slash. Backups when those are unavailable.
    skills:
      - skill: hazy_path
        note: ↑ + RMB. Movement engage.
      - skill: emberclaw_slash
        note: SHIFT + LMB. Fast-cast Spiritforge entry.
      - skill: emberclaw_finale
        note: SHIFT + Q. Backup entry.
      - skill: emberclaw_crush
        note: E. Backup entry.
      - skill: emberclaw_torrent
        note: SHIFT + RMB. Backup entry.

  - tier: Top Priority
    description: Once Spiritforged, cycle these by cooldown. Emberclaw Slash promotes when -DP needs reapplying.
    skills:
      - skill: emberclaw_slash
        note: -20 DR shred. Top priority while -DP debuff needs reapplying.
      - skill: foxflare_cleave
        note: Q. -12 Evasion debuff.
      - skill: twirling_rhapsody
        note: ← / → + RMB. Protected catch.
      - skill: foxflare_fleche
        note: RMB. +30% Crit Rate self-buff. Notable cancel after Foxflare Ambush.
        prefers_after: foxflare_ambush
        prefers_window_ms: 1500
      - skill: flow_emberclaw_sweep
        note: Hold LMB after Emberclaw Slash.
        requires_prev: emberclaw_slash
        requires_window_ms: 1500

  - tier: Core DPS
    description: Cycle by cooldown. Foxflare Stroke +18 AP only matters below AP caps.
    skills:
      - skill: twirling_foxflare
        note: SHIFT + F. Notable cancel after Twirling Retreat.
        prefers_after: twirling_retreat
        prefers_window_ms: 1500
      - skill: flow_foxflare_encore
        note: Hold F after Twirling Foxflare.
        requires_prev: twirling_foxflare
        requires_window_ms: 1500
      - skill: emberclaw_finale
        note: SHIFT + Q.
      - skill: foxflare_ambush
        note: F.
      - skill: foxflare_stroke
        note: ↓ + RMB. +18 AP buff (skip when at AP cap).
      - skill: emberclaw_crush
        note: E.
      - skill: twirling_retreat
        note: ↓ + F. Reposition into Twirling Foxflare or Emberclaw Torrent.
      - skill: emberclaw_torrent
        note: SHIFT + RMB. Notable cancel after Twirling Retreat.
        prefers_after: twirling_retreat
        prefers_window_ms: 1500

  - tier: Filler
    description: Use when nothing higher is off cooldown.
    skills:
      - skill: fan_kick
        note: ↓ + LMB.
      - skill: foxflare_ambush
        note: Filler when off cooldown above.
      - skill: foxflare_fleche
        note: Filler when off cooldown above.
      - skill: twirling_rhapsody
        note: Filler when off cooldown above.
