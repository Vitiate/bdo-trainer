combo_id: pve_dps_priority
class: Drakania
spec: Awakening
bundle_id: default
category: pve
mode: priority
name: 'PvE — DPS Priority (Hex → Drag → Legacy)'
description: |
  Awakening Drakania PvE rotation (guide courtesy of OP
  Brightflame). The core combo is essentially a fixed string,
  but priority-mode lets you see whatever's off cooldown next
  regardless of where you are in the loop.

  Stance flow:
    Hexeblood (red)  → Doombringer → Dragonblood (blue) →
    Legacy (back to red).

  Core combo (always optimal for protection / dps / flowing):
    W+RMB > W+E > SHIFT+F > S+F > S+RMB > SHIFT+RMB > F >
    LMB+RMB > SHIFT+E > SHIFT+Q > S+E > S+LMB > S+F (hold for
    Storm Piercer flow) > SPACE (Legacy → red)

  Extended combo adds A/D+RMB (Refraction), SHIFT+LMB (Tip of
  the Scale), and the LMB+RMB flow into Cloud's Strife on the
  Dragonblood side. Dragonblood Sundering Roar may not be off
  cooldown depending on attack speed — fall back to a 2nd
  Storm Piercer / Savage Decree pass while you wait.

  Stance note: Tectonic Slam / Sundering Roar / Storm Piercer /
  Savage Decree all cast in both Hexeblood and Dragonblood
  stances with the same key chord. The trainer treats each as
  a single skill — press it in either stance.

  Notable cancels:
    Flow: Concealed Claw  ← after Savage Decree (Hexeblood flow)
    Flow: Cloud's Strife  ← after Spiteful Soul / Tip of the
                            Scale (Dragonblood flow)
    Storm Piercer (alt)   ← F (hold) after Sundering Roar

  Safety:
    The Hexeblood string is protection-optimal — don't deviate
    at high-end spots. The Dragonblood string is more flexible;
    swap by preference or by cooldown.
priority:
  - tier: Hexeblood Engage
    description: |
      Opening / repositioning skills in Hexeblood. Storm Maul
      and Tectonic Slam are the loop openers; Refraction is
      the iframe reposition.
    skills:
      - skill: storm_maul
        note: W+RMB. iframe KD + DA. Opener.
      - skill: tectonic_slam
        note: W+E (Hex) or S+E (Drag). SA full-CC. Casts in either stance.
      - skill: refraction
        note: A/D+RMB. iframe reposition.

  - tier: Core DPS
    description: |
      Main damage skills. Run in the listed Hex order:
      Extinction → Sundering Roar → Storm Piercer → Spiteful
      Soul → Crackling Flame → Flow: Concealed Claw → Flow:
      Obliterate. Then Doombringer transitions to Dragonblood.
    skills:
      - skill: extinction
        note: SHIFT+F. KD + AA. -DR debuff and atk/cast speed addon.
      - skill: sundering_roar
        note: S+F (Hex) or S+F (Drag). FG DA. Casts in either stance.
      - skill: storm_piercer
        note: S+RMB. FG stun + DA. Full string for extended FG. Alt F(hold) after Sundering Roar.
      - skill: spiteful_soul
        note: SHIFT+RMB. SA float.
      - skill: crackling_flame
        note: F. DA.
      - skill: flow_concealed_claw
        note: LMB+RMB after Savage Decree. FG DA — Hexeblood flow.
        requires_prev: savage_decree
        requires_window_ms: 1500
      - skill: flow_obliterate
        note: SHIFT+E. SA bound + DA.

  - tier: Stance Transition
    description: |
      Doombringer transitions Hexeblood → Dragonblood and is a
      strong full-CC cast on its own.
    skills:
      - skill: doombringer
        note: SHIFT+Q. iframe full-CC payload. → Dragonblood.

  - tier: Dragonblood DPS
    description: |
      Dragonblood-side skills. Cycle by cooldown. Savage Decree
      has back attack damage / crit dmg addon; Tip of the
      Scale's flow chains into Cloud's Strife.
    skills:
      - skill: savage_decree
        note: S+LMB in Dragonblood. Hold LMB to continue.
      - skill: tip_of_the_scale
        note: SHIFT+LMB in Dragonblood. SA KD + DA.
      - skill: flow_cloud_s_strife
        note: LMB+RMB after Spiteful Soul / Tip of the Scale (Dragonblood).
        requires_prev:
          - spiteful_soul
          - tip_of_the_scale
        requires_window_ms: 1500

  - tier: Closer
    description: Legacy snaps you back to Hexeblood (red) to restart the loop.
    skills:
      - skill: legacy
        note: SPACE. FG DA + AA. Returns to Hexeblood stance.
