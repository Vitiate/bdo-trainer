combo_id: pvp_hanpuri_lurking
class: Maegu
spec: Succession
bundle_id: default
category: pvp
name: 'PvP — Hanpuri (Lurking finisher)'
description: |
  Backpedal CC. Soulsnare → Flow: Hanpuri lets you teleport
  into the target while staying protected. Spirit Parade is
  used over Heavenly Return for protection. Charmed is
  required here — Foxflare Fling is NOT interchangeable
  because the cast off Spirit Parade demands Charmed's window.

  W/S+E > F(Hold) > SPACE > SHIFT+Q > S+F > D+LMB > RMB >
  SHIFT+C > W+RMB

  Courtesy of Bantalope.
difficulty: advanced
combo_window_ms: 300
steps:
- skill: prime_flower_shroud
  note: 'W+E (forward) or S+E (backward).'
- skill: soulsnare
  note: F. Drops the snare.
- skill: flow_hanpuri
  note: F (hold). Targeted teleport — stiffen.
- skill: spirit_parade
  note: SHIFT+X (or chain via Hanpuri). SA + reposition.
- skill: charmed
  note: S+SPACE. Required — Fling won't slot here.
- skill: prime_foxflare
  note: SHIFT+Q. Knockdown.
- skill: prime_lurking_claws
  note: S+F.
- skill: prime_bared_claws
  note: D+LMB.
- skill: prime_foxspirit_tag
  note: RMB.
- skill: prime_nukduri_dance
  note: SHIFT+C.
- skill: prime_heavenward_dance
  note: W+RMB.
