combo_id: pvp_dps_priority
class: Maegu
spec: Succession
bundle_id: default
category: pvp
mode: priority
name: 'PvP — DPS Priority'
description: |
  Cooldown-driven Succession Maegu rotation. Apply -DP at the
  beginning, then cycle the higher tiers as cooldowns elapse.

  Tier 0 (Spiritforge entry) — start every engagement Spiritforging
  via Hazy Path (movement) or fast-cast Emberclaw Slash. Backups —
  Emberclaw Finale, Emberclaw Crush, Emberclaw Torrent.

  Tier 1 (Top priority) — Foxflare Cleave, Twirling Rhapsody,
  Foxflare Fleche, Emberclaw Slash → Flow: Emberclaw Sweep. Use
  Emberclaw Slash as highest priority while -DP needs reapplying.

  Tier 2 (Core DPS) — Twirling Foxflare → Flow: Foxflare Encore,
  Emberclaw Finale, Foxflare Ambush, Foxflare Stroke (AP buff is
  only relevant below AP caps), Emberclaw Crush, Twirling Retreat
  (into Twirling Foxflare or Emberclaw Torrent), Emberclaw Torrent.

  Tier 3 (Filler) — Fan Kick, plus Foxflare Ambush / Foxflare
  Fleche / Twirling Rhapsody when nothing higher is up.

  Tier 4 (AoE pre-awakening filler) — Constricting Charm /
  Spirit Sparks, -DP via Foxspirit Tag. Swap back to awakening
  as soon as AoE is sufficient.

  Tips —
    Use fast versions of spells listed in Notable Cancels; avoid
    slow versions. Consider AoE when repositioning. Foxflare
    Stroke's AP buff is only relevant below AP caps.
priority:
  - tier: Spiritforge Entry
    description: |
      Start every engagement Spiritforging — Hazy Path for movement,
      or fast-cast Emberclaw Slash. Backups when those are unavailable.
    skills:
      - skill: hazy_path
        note: Movement engage. ↑ + RMB.
      - skill: emberclaw_slash
        note: Fast-cast Spiritforge entry.
      - skill: emberclaw_finale
        note: Backup Spiritforge entry.
      - skill: emberclaw_crush
        note: Backup Spiritforge entry.
      - skill: emberclaw_torrent
        note: Backup Spiritforge entry.

  - tier: Top Priority
    description: Highest priority once Spiritforged. Emberclaw Slash promotes when -DP needs reapplying.
    skills:
      - skill: emberclaw_slash
        note: Highest priority while -DP debuff needs reapplying. Flows into Flow Emberclaw Sweep.
      - skill: foxflare_cleave
        note: Top-priority damage / -Evasion debuff.
      - skill: twirling_rhapsody
        note: Protected catch.
      - skill: foxflare_fleche
        note: +Crit Rate self-buff.
      - skill: flow_emberclaw_sweep
        note: Follow-up to Emberclaw Slash.

  - tier: Core DPS
    description: Cycle these by cooldown. Foxflare Stroke's +18 AP buff is only relevant below AP caps.
    skills:
      - skill: twirling_foxflare
      - skill: flow_foxflare_encore
        note: Hold F after Twirling Foxflare.
      - skill: emberclaw_finale
      - skill: foxflare_ambush
      - skill: foxflare_stroke
        note: '+18 AP buff (skip when at AP cap).'
      - skill: emberclaw_crush
      - skill: twirling_retreat
        note: Reposition into Twirling Foxflare or Emberclaw Torrent.
      - skill: emberclaw_torrent

  - tier: Filler
    description: Use when nothing higher is off cooldown.
    skills:
      - skill: fan_kick
      - skill: foxflare_ambush
        note: Filler when off cooldown above.
      - skill: foxflare_fleche
        note: Filler when off cooldown above.
      - skill: twirling_rhapsody
        note: Filler when off cooldown above.

  - tier: AoE / Pre-Awakening
    description: AoE filler while gathering (e.g. DSR smallies). Swap back to Awakening as soon as AoE is sufficient.
    skills:
      - skill: constricting_charm
      - skill: spirit_sparks
      - skill: foxspirit_tag
        note: '-DP debuff in pre-awakening.'
