category: pvp
name: 'PvP — Stiff/Foxflare (Lurking finisher)'
description: |
  Off-of-stiff combo. Open from a Charmed stiff (S+SPACE) or
  from a Soul Tear clone bait. Foxflare is a knockdown so
  Petal Play (the float re-CC) is the only reliable continuation.

  (SPACE>) SHIFT+Q > S+LMB > SHIFT+LMB > S+F > SHIFT+C > W+RMB

  Courtesy of Bantalope.
difficulty: advanced
combo_window_ms: 300
steps:
- skill: charmed
  note: 'Optional opener — S+SPACE if not already stiff-locked.'
- skill: prime_foxflare
  note: SHIFT+Q. Knockdown.
- skill: prime_spirited_away
  note: S+LMB.
- skill: prime_petal_play
  note: SHIFT+LMB. Float re-CC after the KD.
- skill: prime_lurking_claws
  note: S+F.
- skill: prime_nukduri_dance
  note: SHIFT+C.
- skill: prime_heavenward_dance
  note: W+RMB.
