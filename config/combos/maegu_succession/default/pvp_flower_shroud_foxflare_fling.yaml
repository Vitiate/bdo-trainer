combo_id: pvp_flower_shroud_foxflare_fling
class: Maegu
spec: Succession
bundle_id: default
category: pvp
name: 'PvP — Flower Shroud (Foxflare Fling)'
description: |
  Highest single-target burst variation of the Flower Shroud
  combo. Uses Foxflare Fling for the re-CC into Prime: Foxflare
  for higher damage on flat ground. Switch to the Charmed
  variant for uneven terrain.

  W/S+E > S+F > D+LMB > RMB > E > SHIFT+Q > SHIFT+X > W+RMB >
  SHIFT+C > SHIFT+F

  Courtesy of Bantalope.
difficulty: advanced
combo_window_ms: 300
steps:
- skill: prime_flower_shroud
  note: 'W+E (forward) or S+E (backward).'
- skill: prime_lurking_claws
  note: S+F.
- skill: prime_bared_claws
  note: D+LMB (right) — flow into Foxspirit Tag.
- skill: prime_foxspirit_tag
  note: RMB. -20 DR debuff and float / down-attack.
- skill: foxflare_fling
  note: E. Re-CC stiffen — higher damage than Charmed on flat ground.
- skill: prime_foxflare
  note: SHIFT+Q. Knockdown.
- skill: spirit_parade
  note: SHIFT+X. Repositions behind target for back-attack on Heavenward.
- skill: prime_heavenward_dance
  note: W+RMB. KD / stun smash.
- skill: prime_nukduri_dance
  note: SHIFT+C. AP buff + damage.
- skill: prime_spirit_swirl
  note: SHIFT+F. Disengage / closer.
