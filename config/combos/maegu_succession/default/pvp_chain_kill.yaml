combo_id: pvp_chain_kill
class: Maegu
spec: Succession
bundle_id: default
category: pvp
mode: priority
name: 'PvP — Catch Kill Chain (protected)'
description: |
  Tightened priority/chain combo focused on protected high-burst
  skills that maintain a CC chain. Pulled from the patterns
  across Bantalope's Succession PvP combo set; the unprotected
  re-CCs (Charmed, Foxflare Fling, Petal Play) and the unprotected
  KD opener (Prime: Foxflare) are intentionally excluded from
  this priority — they're still legal to cast, just not
  highlighted as "next best".

  Tier flow:
    Catch       → engage in protection, land the first CC
    Burst       → protected damage during the catch's lock window
                  (most "CC" tags on these are PvE-only — they
                  don't re-CC in PvP, but they keep you in
                  protection while you damage)
    Smash/Out   → protected smash damage on the down/float, plus a
                  stun/iframe disengage

  CC budget: BDO caps you around 4 hard-CCs per ~6s window before
  iframes; the trainer tracks this. Several Maegu skills list a
  CC in their tooltip that's PvE-only — those are stripped via
  the cc_pvp override on each row so the budget reflects only
  CC that actually fires in PvP.

  Courtesy of Bantalope (source combos), trainer extrapolation.
chain:
  max_hard_cc: 4
  window_ms: 6000
  idle_reset_ms: 3000
  finishers:
    - spirit_parade
    - prime_spirit_swirl
priority:
  - tier: Catch
    description: |
      Protected openers that land the first CC. Bristling Sparks
      and Soul Tear are SA; Flower Shroud is FG with a long stun
      and the strongest engage damage.
    skills:
      - skill: prime_bristling_sparks
        note: SHIFT+RMB. SA stun + DA at short/mid range.
      - skill: prime_soul_tear
        note: W+Q. SA stiffen + DA from clone-bait range.
      - skill: prime_flower_shroud
        note: W+D forward / S+D backward. FG stun + DA + AA.

  - tier: Burst
    description: |
      Protected high-damage skills cast inside the catch's lock
      window. Bared Claws is FG and lands the highest single-
      skill PvP damage (77%) — its stiffness is PvE-only so it
      doesn't extend the chain, but the cancel-flow into
      Foxspirit Tag is the core damage cycle. Foxspirit Tag is
      SA and applies -20 DR; its float is also PvE-only.
    skills:
      - skill: prime_bared_claws
        note: D+LMB / A+LMB. FG, 77% PvP dmg (no PvP CC — pure damage).
        cc_pvp: []
      - skill: prime_foxspirit_tag
        note: RMB. SA, -20 DR debuff. Down-attack only in PvP.
        cc_pvp: ['down_attack', 'air_attack']
        prefers_after:
          - prime_bared_claws
          - prime_flower_shroud
        prefers_window_ms: 1500

  - tier: Smash/Out
    description: |
      Protected smash damage during the down/float window, plus
      the iframe Spirit Swirl closer. Heavenward Dance is the
      KD smash; Lurking Claws and Spirit Parade reposition for
      back-attack.
    skills:
      - skill: prime_heavenward_dance
        note: W+RMB. SA KD/stun smash. Best back-attack target.
      - skill: prime_lurking_claws
        note: S+F. SA DA + reposition behind target.
      - skill: spirit_parade
        note: SHIFT+X. SA DA + 100% back-attack repositioner.
      - skill: prime_spirit_swirl
        note: SHIFT+F. iframe stun + DA — disengage finisher.
